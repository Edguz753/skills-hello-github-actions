name: Post welcome commet
on: 
  pull_request:
    types: [opened]
permissions: 
  pull-requests: write
jobs:
  welcome:
    name: Post welcome commet
    runs-on: ubuntu-latest
    steps:
      - run: gh pr comment "$PR_URL" --body "Welcome to the Repository!"
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          
      
